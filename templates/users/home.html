{% extends "base.html" %}
{% load socialaccount %}

{% block content %}
    {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button type="submit">로그아웃하기</button>
        </form>
    {% else %}
        <form method="post" action="{% provider_login_url 'google' %}">
            {% csrf_token %}
            <button type="submit">로그인하기</button>
        </form>
    {% endif %}
{% endblock %}
