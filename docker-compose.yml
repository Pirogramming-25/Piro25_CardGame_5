services:
  db:
    image: mysql:8.4
    container_name: piro-card-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-piro_card_game}
      MYSQL_USER: ${MYSQL_USER:-piro_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-piro_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-piro_root_password}
    volumes:
      - piro-card-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    image: ${DOCKER_IMAGE:-minseo0614/piro-card-game:latest}
    container_name: piro-card-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-piro_card_game}
      MYSQL_USER: ${MYSQL_USER:-piro_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-piro_password}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    ports:
      - "8000:8000"

volumes:
  piro-card-mysql-data:
